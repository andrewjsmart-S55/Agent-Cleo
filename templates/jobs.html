{% extends "base.html" %}

{% block title %}Jobs - AI Agent Manager{% endblock %}

{% block content %}
<div x-data="jobsManager()" x-init="init()">
    <!-- Header -->
    <div class="px-4 py-5 sm:px-6 bg-white rounded-lg shadow mb-6">
        <div class="flex justify-between items-center">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Job Management</h2>
                <p class="mt-1 text-sm text-gray-500">Create and manage scheduled tasks for your agents</p>
            </div>
            <button @click="showCreateModal = true" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create Job
            </button>
        </div>
    </div>

    <!-- Filter -->
    <div class="bg-white shadow rounded-lg p-4 mb-6">
        <div class="flex items-center space-x-4">
            <label class="text-sm font-medium text-gray-700">Filter by Agent:</label>
            <select x-model="selectedAgentId" @change="filterJobs()" class="border-gray-300 rounded-lg text-sm">
                <option value="">All Agents</option>
                <template x-for="agent in agents" :key="agent.id">
                    <option :value="agent.id" x-text="agent.name"></option>
                </template>
            </select>
        </div>
    </div>

    <!-- Jobs List -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <div x-show="filteredJobs.length === 0" class="text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <h3 class="mt-2 text-sm font-medium text-gray-900">No jobs found</h3>
            <p class="mt-1 text-sm text-gray-500">Create your first job to get started</p>
        </div>

        <ul class="divide-y divide-gray-200">
            <template x-for="job in filteredJobs" :key="job.id">
                <li class="p-6 hover:bg-gray-50">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center">
                                <h3 class="text-lg font-semibold text-gray-900" x-text="job.name"></h3>
                                <span class="ml-3 px-2 py-1 text-xs font-semibold rounded"
                                      :class="getStatusColor(job.status)"
                                      x-text="job.status"></span>
                            </div>
                            <p class="text-sm text-gray-600 mt-1" x-text="job.description"></p>

                            <div class="mt-3 flex flex-wrap gap-4 text-sm text-gray-500">
                                <div class="flex items-center">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                    </svg>
                                    <span x-text="job.agent_name"></span>
                                </div>
                                <div class="flex items-center">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span x-text="job.frequency || 'Manual'"></span>
                                </div>
                                <div x-show="job.last_run" class="flex items-center">
                                    <span class="mr-1">Last run:</span>
                                    <span x-text="formatDate(job.last_run)"></span>
                                </div>
                                <div x-show="job.next_run" class="flex items-center">
                                    <span class="mr-1">Next run:</span>
                                    <span x-text="formatDate(job.next_run)"></span>
                                </div>
                            </div>

                            <div x-show="job.sop" class="mt-3">
                                <details class="text-sm">
                                    <summary class="cursor-pointer text-blue-600 hover:text-blue-700 font-medium">View SOP</summary>
                                    <div class="mt-2 p-3 bg-gray-50 rounded border border-gray-200">
                                        <pre class="whitespace-pre-wrap text-xs" x-text="job.sop"></pre>
                                    </div>
                                </details>
                            </div>
                        </div>

                        <div class="ml-4 flex flex-col space-y-2">
                            <button @click="runJob(job)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded text-sm">
                                Run Now
                            </button>
                            <button @click="editJob(job)" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-sm">
                                Edit
                            </button>
                            <button @click="deleteJob(job)" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
                                Delete
                            </button>
                        </div>
                    </div>
                </li>
            </template>
        </ul>
    </div>

    <!-- Create/Edit Job Modal -->
    <div x-show="showCreateModal || showEditModal" x-cloak class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50" @click.self="closeModal()">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold" x-text="showEditModal ? 'Edit Job' : 'Create New Job'"></h3>
                <button @click="closeModal()" class="text-gray-400 hover:text-gray-500">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <form @submit.prevent="saveJob()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Agent</label>
                    <select x-model="jobForm.agent_id" required class="w-full border-gray-300 rounded-lg">
                        <option value="">Select an agent</option>
                        <template x-for="agent in agents" :key="agent.id">
                            <option :value="agent.id" x-text="agent.name"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Job Name</label>
                    <input type="text" x-model="jobForm.name" required class="w-full border-gray-300 rounded-lg" placeholder="e.g., Daily Report Generation">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea x-model="jobForm.description" rows="3" class="w-full border-gray-300 rounded-lg" placeholder="What does this job do?"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Run Frequency</label>
                    <select x-model="jobForm.frequency" class="w-full border-gray-300 rounded-lg">
                        <option value="manual">Manual</option>
                        <option value="once">Once</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Standard Operating Procedure (SOP)</label>
                    <textarea x-model="jobForm.sop" rows="8" class="w-full border-gray-300 rounded-lg font-mono text-sm" placeholder="Step-by-step instructions for this job..."></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" @click="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg">
                        <span x-text="showEditModal ? 'Update Job' : 'Create Job'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function jobsManager() {
    return {
        jobs: [],
        agents: [],
        selectedAgentId: '',
        showCreateModal: false,
        showEditModal: false,
        jobForm: {
            id: null,
            agent_id: '',
            name: '',
            description: '',
            frequency: 'manual',
            sop: ''
        },

        get filteredJobs() {
            if (!this.selectedAgentId) return this.jobs;
            return this.jobs.filter(j => j.agent_id == this.selectedAgentId);
        },

        async init() {
            await this.loadAgents();
            await this.loadJobs();

            // Check for agent_id in URL params
            const params = new URLSearchParams(window.location.search);
            const agentId = params.get('agent_id');
            if (agentId) {
                this.selectedAgentId = agentId;
            }
        },

        async loadAgents() {
            const response = await fetch('/api/agents');
            this.agents = await response.json();
        },

        async loadJobs() {
            const response = await fetch('/api/jobs');
            this.jobs = await response.json();
        },

        filterJobs() {
            // Filtering is reactive via computed property
        },

        async saveJob() {
            try {
                const url = this.showEditModal ? `/api/jobs/${this.jobForm.id}` : '/api/jobs';
                const method = this.showEditModal ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.jobForm)
                });

                const data = await response.json();

                if (data.success) {
                    showToast(this.showEditModal ? 'Job updated' : 'Job created', 'success');
                    await this.loadJobs();
                    this.closeModal();
                } else {
                    showToast(data.error || 'Failed to save job', 'error');
                }
            } catch (error) {
                showToast('Error saving job', 'error');
            }
        },

        editJob(job) {
            this.jobForm = {
                id: job.id,
                agent_id: job.agent_id,
                name: job.name,
                description: job.description || '',
                frequency: job.frequency || 'manual',
                sop: job.sop || ''
            };
            this.showEditModal = true;
        },

        async deleteJob(job) {
            if (!confirm(`Delete job "${job.name}"?`)) return;

            try {
                const response = await fetch(`/api/jobs/${job.id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showToast('Job deleted', 'success');
                    await this.loadJobs();
                } else {
                    showToast(data.error || 'Failed to delete job', 'error');
                }
            } catch (error) {
                showToast('Error deleting job', 'error');
            }
        },

        async runJob(job) {
            try {
                const response = await fetch(`/api/jobs/${job.id}/run`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    await this.loadJobs();
                } else {
                    showToast(data.error || 'Failed to run job', 'error');
                }
            } catch (error) {
                showToast('Error running job', 'error');
            }
        },

        closeModal() {
            this.showCreateModal = false;
            this.showEditModal = false;
            this.jobForm = {
                id: null,
                agent_id: '',
                name: '',
                description: '',
                frequency: 'manual',
                sop: ''
            };
        },

        getStatusColor(status) {
            const colors = {
                'active': 'bg-green-100 text-green-800',
                'paused': 'bg-yellow-100 text-yellow-800',
                'completed': 'bg-blue-100 text-blue-800',
                'failed': 'bg-red-100 text-red-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        },

        formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleString();
        }
    }
}
</script>
{% endblock %}
